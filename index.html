<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Taconazo Club</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8ed;
      color: #292019;
      text-align: center;
    }
    header {
      background: #7f1d1d;
      color: white;
      padding: 30px 15px;
    }
    main {
      max-width: 420px;
      margin: 30px auto;
      padding: 20px;
    }
    section {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px #00000012;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #d6c7b6; }
    button {
      background: #b91c1c;
      color: white;
      border: 0;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌮 El Taconazo Club</h1>
    <p>¡Tus tacos te dan recompensas!</p>
  </header>
  <main>
    <section>
      <h2>Consulta tus puntos</h2>
      <p>Escribe tu teléfono para consultar tu saldo.</p>
      <form id="consulta">
        <input id="telefono" type="tel" placeholder="Tu número de teléfono" required>
        <button type="submit">Consultar mis puntos</button>
      </form>
      <p id="resultado">Estamos preparando tu consulta de puntos.</p>
    </section>
  </main>
  <script>
    document.getElementById('consulta').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('resultado').textContent =
        'La consulta de puntos aún no está conectada.';
    });
  </script>
</body>
</html>
